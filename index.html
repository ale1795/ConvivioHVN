<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#091712" />
    <title>Selfie Navideña — Cabina de Fotos con Marcos y Fondos IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body class="booth-body">
    <div class="snow-backdrop" aria-hidden="true"></div>

    <main class="booth-shell">
      <!-- Top Bar -->
      <header class="top-bar">
        <div class="brand-badge">
          <span class="brand-icon" aria-hidden="true">🎄</span>
          <h1>Selfie Navideña</h1>
        </div>

        <div class="top-actions">
          <button
            id="ratioBtn"
            class="icon-btn"
            type="button"
            title="Cambiar formato de foto"
            aria-label="Cambiar formato de foto"
          >
            3:4
          </button>

          <button
            id="timerBtn"
            class="icon-btn"
            type="button"
            title="Temporizador 3 segundos"
            aria-label="Activar temporizador"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="13" r="8" />
              <path d="M12 9v4l2.5 1.5" />
              <path d="M9 2h6" />
            </svg>
            <span id="timerLabel">Off</span>
          </button>

          <button
            id="flipCameraBtn"
            class="icon-btn"
            type="button"
            title="Cambiar cámara frontal / trasera"
            aria-label="Cambiar cámara"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
              <path d="M3 3v5h5" />
              <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
              <path d="M16 16h5v5" />
            </svg>
          </button>

          <a href="./qr.html" class="icon-btn" title="Generar código QR para compartir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="1" />
              <rect x="14" y="3" width="7" height="7" rx="1" />
              <rect x="3" y="14" width="7" height="7" rx="1" />
              <path d="M14 14h3v3h-3zM18 18h3v3h-3zM18 14h3M14 21h3" />
            </svg>
            <span class="btn-text-hide-xs">QR</span>
          </a>
        </div>
      </header>

      <!-- Live Camera / Photo Stage -->
      <section class="stage-wrap" aria-label="Vista previa de selfie">
        <div id="viewportFrame" class="viewport-frame" data-ratio="3:4">
          <video id="cameraVideo" playsinline autoplay muted></video>
          <canvas id="previewCanvas"></canvas>

          <!-- AI Status Pill -->
          <div id="statusPill" class="status-pill hidden" role="status" aria-live="polite">
            <span class="spinner" aria-hidden="true"></span>
            <span id="statusText">Preparando fondos IA...</span>
          </div>

          <!-- Uploaded Photo Mode Bar -->
          <div id="photoModeBar" class="photo-mode-bar hidden">
            <span>📸 Editando foto subida</span>
            <button id="backToCameraBtn" type="button">Usar cámara</button>
          </div>

          <!-- Countdown & Flash -->
          <div id="countdownOverlay" class="countdown-overlay hidden" aria-live="assertive">3</div>
          <div id="shutterFlash" class="shutter-flash" aria-hidden="true"></div>

          <!-- Camera Welcome / Permission Prompt -->
          <div id="cameraPrompt" class="camera-prompt">
            <div class="prompt-emblem" aria-hidden="true">🎅</div>
            <h2 id="promptTitle">¡Lista tu Cabina Navideña!</h2>
            <p id="promptMessage">
              Activa tu cámara para tomarte una selfie con marcos festivos y fondos navideños con IA en tiempo real.
            </p>
            <div class="prompt-buttons">
              <button id="startCameraBtn" class="btn btn-primary" type="button">
                📷 Activar Cámara
              </button>
              <button id="promptUploadBtn" class="btn btn-secondary" type="button">
                🖼️ Subir una foto
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- Bottom Control Dock -->
      <section class="control-dock" aria-label="Selector de marcos y fondos">
        <div class="dock-header">
          <div class="mode-tabs" role="tablist">
            <button
              id="tabFrames"
              class="tab-btn is-active"
              type="button"
              role="tab"
              aria-selected="true"
            >
              🖼️ Marcos
            </button>
            <button
              id="tabBackgrounds"
              class="tab-btn"
              type="button"
              role="tab"
              aria-selected="false"
            >
              🎄 Fondos IA
            </button>
          </div>

          <span id="activeSelectionLabel" class="active-selection-label">Marco: Guirnalda</span>
        </div>

        <!-- Frame Picker Carousel -->
        <div id="framesStrip" class="picker-strip" role="listbox" aria-label="Marcos navideños"></div>

        <!-- Background Picker Carousel -->
        <div
          id="backgroundsStrip"
          class="picker-strip hidden"
          role="listbox"
          aria-label="Fondos navideños con IA"
        ></div>

        <!-- Shutter Controls -->
        <div class="shutter-row">
          <div class="shutter-side">
            <button id="uploadBtn" class="mini-action" type="button" title="Subir foto desde tu galería">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <circle cx="8.5" cy="8.5" r="1.5" />
                <path d="m21 15-5-5L5 21" />
              </svg>
              <span>Subir foto</span>
            </button>
            <input id="photoUploadInput" type="file" accept="image/*" hidden />
          </div>

          <button
            id="shutterBtn"
            class="shutter-btn"
            type="button"
            aria-label="Tomar selfie"
            title="Tomar selfie"
          >
            <span class="shutter-btn-inner">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" />
                <circle cx="12" cy="13" r="3.5" />
              </svg>
            </span>
          </button>

          <div class="shutter-side right">
            <button id="mirrorBtn" class="mini-action" type="button" title="Voltear espejo">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 3v18" />
                <path d="m8 7-5 5 5 5V7Z" />
                <path d="m16 7 5 5-5 5V7Z" />
              </svg>
              <span>Espejo</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Captured Photo Preview Modal -->
    <div id="captureModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-card">
        <div class="modal-head">
          <h2 id="modalTitle">✨ ¡Tu Selfie Navideña!</h2>
          <button id="closeModalBtn" class="icon-btn" type="button" aria-label="Cerrar">✕</button>
        </div>

        <div class="modal-preview-wrap">
          <img id="capturedImage" alt="Vista previa de tu selfie navideña" />
        </div>

        <div class="modal-actions">
          <button id="downloadBtn" class="btn btn-gold" type="button">
            ⬇️ Descargar
          </button>
          <button id="shareBtn" class="btn btn-primary" type="button">
            📤 Compartir
          </button>
          <button id="retakeBtn" class="btn btn-secondary btn-full" type="button">
            📸 Tomar otra foto
          </button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
